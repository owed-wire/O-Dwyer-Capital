<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found - O'Dwyer Capital</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c110f;
    --line-strong: rgba(236, 231, 220, 0.16);
    --text: #ece7dc;
    --muted: #a2a89f;
    --gold: #c9a55c;
    --gold-soft: #e2c88f;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; text-align: center;
    padding: 32px 16px;
    background: radial-gradient(ellipse 60% 60% at 50% 0%, rgba(47, 107, 79, 0.3), transparent 70%), var(--bg);
    color: var(--text); font: 400 16px/1.65 var(--sans); -webkit-font-smoothing: antialiased;
  }
  img { width: 56px; height: auto; margin: 0 auto 32px; display: block; }
  .code { font: 500 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  h1 { font: 300 clamp(36px, 6vw, 56px)/1.1 var(--serif); letter-spacing: -0.02em; margin: 18px 0 14px; }
  h1 em { font-style: italic; color: var(--gold-soft); }
  p { color: var(--muted); max-width: 420px; margin: 0 auto 32px; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-flex; padding: 14px 22px; border-radius: 999px; font: 500 14px/1 var(--sans);
    color: var(--text); text-decoration: none; border: 1px solid var(--line-strong); transition: border-color .2s, background .2s;
  }
  a.btn:hover { border-color: var(--gold); }
  a.btn.gold { background: var(--gold); border-color: var(--gold); color: #17140d; }
  a.btn.gold:hover { background: var(--gold-soft); border-color: var(--gold-soft); }
</style>
</head>
<body>
  <main>
    <img src="/assets/mark-96.png" alt="O'Dwyer Capital" width="56" height="54">
    <div class="code">404 · Page not found</div>
    <h1>This page <em>doesn’t exist.</em></h1>
    <p>The link may be out of date, or the page may have moved. Our research archive lists every brief we’ve published.</p>
    <div class="actions">
      <a class="btn gold" href="/thoughts.html">Browse research</a>
      <a class="btn" href="/">Go to homepage</a>
    </div>
  </main>
</body>
</html>
